name: Build RoManager exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconsole --onefile --name RoManager --collect-all customtkinter romanager.py
      - uses: actions/upload-artifact@v4
        with:
          name: RoManager-exe
          path: dist/RoManager.exe
