name: Build RoManager exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter psutil pillow pywebview pythonnet pyinstaller

      - name: Check files
        shell: pwsh
        run: |
          if (!(Test-Path "romanager.py")) {
              throw "romanager.py not found!"
          }

          if (!(Test-Path "icon.ico")) {
              throw "icon.ico not found in repository root!"
          }

      - name: Build RoManager EXE
        run: |
          python -m PyInstaller --clean --noconfirm --noconsole --onefile --name RoManager --icon=icon.ico --collect-all customtkinter --collect-all webview --collect-all pythonnet --collect-all clr_loader --hidden-import clr romanager.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RoManager-exe
          path: dist/RoManager.exe
          if-no-files-found: error
