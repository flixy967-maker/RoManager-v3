name: Build RoManager exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter psutil pillow pywebview pythonnet pyinstaller

      - name: Find and create icon
        shell: pwsh
        run: |
          if (Test-Path "icon.png") {
              $iconPath = "icon.png"
          }
          elseif (Test-Path "assets/icon.png") {
              $iconPath = "assets/icon.png"
          }
          else {
              Write-Host "ERROR: icon.png was not found."
              Write-Host "Repository files:"
              Get-ChildItem -Recurse -File | Select-Object FullName
              exit 1
          }

          python -c "import sys; from PIL import Image; img=Image.open(sys.argv[1]).convert('RGBA'); img.save('icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])" $iconPath

          if (!(Test-Path "icon.ico")) {
              throw "Icon conversion failed!"
          }

      - name: Check application file
        shell: pwsh
        run: |
          if (!(Test-Path "romanager.py")) {
              throw "romanager.py was not found!"
          }

      - name: Build RoManager EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --noconsole `
            --onefile `
            --name RoManager `
            --icon=icon.ico `
            --collect-all customtkinter `
            --collect-all webview `
            --collect-all pythonnet `
            --collect-all clr_loader `
            --hidden-import clr `
            romanager.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RoManager-exe
          path: dist/RoManager.exe
          if-no-files-found: error
