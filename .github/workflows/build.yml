name: Build RoManager exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter psutil pillow pywebview pythonnet pyinstaller

      - name: Create icon
        run: python -c "from PIL import Image; Image.open('icon.png').convert('RGBA').save('icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build EXE
        run: |
          python -m PyInstaller --clean --noconfirm --noconsole --onefile --name RoManager --icon=icon.ico --collect-all customtkinter --collect-all webview --collect-all pythonnet --collect-all clr_loader --hidden-import clr romanager.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RoManager-exe
          path: dist/RoManager.exe
          if-no-files-found: error
